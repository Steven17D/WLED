t<script>\n\t\tconst paths={chevron:'m6 9 6 6 6-6',close:'m6 6 12 12M18 6 6 18',power:'M12 3v9M6 5.5a8 8 0 1 0 12 0',sliders:'M4 7h8m4 0h4M4 17h3m4 0h9M12 4v6M7 14v6',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z',gear:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Zm3 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6',more:'M5 12h.01M12 12h.01M19 12h.01',rotate:'M20 7v5h-5M20 12a8 8 0 1 0-3 6',layout:'M3 6h18M3 12h18M3 18h18M7 4v4M17 10v4M10 16v4',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1',info:'M12 10v7m0-11h.01M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',monitor:'M3 4h18v12H3ZM12 16v4m-4 0h8',strip:'M4 6h16v12H4ZM7 10h.01M12 10h.01M17 10h.01M7 14h.01M12 14h.01M17 14h.01',timer:'M12 7v6l3 2M9 2h6M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18',sync:'M3 7h14l-3-3m3 3-3 3M21 17H7l3 3m-3-3 3-3',peek:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',plus:'M12 5v14M5 12h14',wifi:'M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01',lock:'M6 10h12v11H6ZM8 10V6a4 4 0 0 1 8 0v4'};\n\t\tfunction icon(name) {return `<svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"${paths[name]||paths.sliders}\"/><\/svg>`;}\n\t\tconst effects=['Blends','Ripple Rainbow','Aurora','Solid','Fire 2012','Noise','Pacifica','Rainbow','Akemi','Black Hole','Blink','Blobs','Blurz','Bouncing Balls','Breathe','Chase','Colorwaves','Dancing Shadows','Drip','Flow','Glitter','Lake','Meteor','Ocean','Plasma','Twinkle'].map((name,i)=>({name,swatch:`linear-gradient(${130+i*11}deg,hsl(${280+i*29} 35% 72%),hsl(${20+i*37} 40% 78%),hsl(${160+i*23} 32% 74%))`}));\n\t\tconst palettes=['Color Gradient','Default','Aurora','Ocean','Sunset','Forest','Lava','Ice','Pastel','Rainbow','Warm white','Cool white'];\n\t\tconst strips=[{name:'Light bar',leds:119,color:'#dfac79',a:[1,1],b:[1,0],icon:'strip'},{name:'Desk',leds:118,color:'#86a2df',a:[0,.583],b:[1,.583],icon:'strip'},{name:'Left monitor',leds:31,color:'#b294c7',a:[.4983,.3007],b:[.2227,.2992],icon:'monitor'},{name:'Right monitor',leds:31,color:'#81b8b2',a:[.5252,.3],b:[.7993,.3],icon:'monitor'}];\n\t\tconst state={on:true,bri:80,speed:73,intensity:10,white:0,color:'#e5ae9c',effect:'Blends',palette:'Color Gradient',strip:-1,stage:'scene',rotation:90,showPaths:true,timer:0,sync:false,peek:false,reverse:[false,false,false,false]};\n\t\tlet activeOverlay=null,lastFocus=null,toastTimer;\n\t\t// Accessible sliders keep their visible values synchronized with local state.\n\t\tfunction slider(label,key) {return `<label><span class=\"row\"><span>${label}<\/span><output data-value=\"${key}\">${state[key]}%<\/output><\/span><span class=\"sliderline\">${icon('sun')}<input type=\"range\" min=\"0\" max=\"100\" value=\"${state[key]}\" aria-label=\"${label}\" data-range=\"${key}\" style=\"--fill:${state[key]}%\"><\/span><\/label>`;}\n\t\tfunction notify(message) {const toast=document.getElementById('toast');toast.textContent=message;toast.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity=0,1800);}\n\t\t// Draw captured normalized geometry over synthetic artwork; this is not live Peek.\n\t\tfunction scene() {\n\t\t\tif(state.stage==='strips')return `<div class=\"strip-screen scroll\">${strips.map((s,i)=>`<section class=\"strip-detail\"><div class=\"row\"><h3>${s.name}<\/h3><button data-focus-strip=\"${i}\">${state.strip===i?'Show all':'Focus'}<\/button><\/div><p class=\"small\">${s.leds} LEDs · Canvas Slice · ${state.reverse[i]?'Reversed':'Forward'}<\/p><div class=\"row\"><span class=\"small\">LED direction<\/span><button class=\"switch\" role=\"switch\" aria-label=\"Reverse ${s.name}\" aria-checked=\"${state.reverse[i]}\" data-reverse=\"${i}\"><\/button><\/div><\/section>`).join('')}<\/div>`;\n\t\t\treturn `<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Simulated scene with four saved strip paths\"><defs><linearGradient id=\"field\" x1=\"0\" y1=\"1\" x2=\"1\" y2=\"0\"><stop stop-color=\"#a7c7d5\"/><stop offset=\".4\" stop-color=\"#ba9cbd\"/><stop offset=\".75\" stop-color=\"#e3b59d\"/><stop offset=\"1\" stop-color=\"#dcd4b2\"/><\/linearGradient><filter id=\"blur\"><feGaussianBlur stdDeviation=\"35\"/><\/filter><pattern id=\"grid\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".7\" fill=\"#8891a4\" opacity=\".2\"/><\/pattern><\/defs><rect x=\"35\" y=\"22\" width=\"570\" height=\"348\" rx=\"14\" fill=\"url(#grid)\"/><g class=\"scene-field\" transform=\"rotate(${state.rotation-90} 320 200)\"><path d=\"M73 273C75 163 189 56 302 77S422 165 559 267L590 343H58Z\" fill=\"url(#field)\" filter=\"url(#blur)\"/><path d=\"M40 304C167 239 125 127 264 127S433 345 605 157\" fill=\"none\" stroke=\"url(#field)\" stroke-width=\"65\" filter=\"url(#blur)\" opacity=\".8\"/><\/g><g id=\"strip-paths\" ${state.showPaths?'':'visibility=\"hidden\"'}>${strips.map((s,i)=>{const a=state.reverse[i]?s.b:s.a,b=state.reverse[i]?s.a:s.b,ax=78+a[0]*480,ay=62+a[1]*240,bx=78+b[0]*480,by=62+b[1]*240;return `<g data-path=\"${i}\" class=\"${state.strip!==-1&&state.strip!==i?'dim':''}\"><path class=\"path-shadow\" d=\"M${ax} ${ay}L${bx} ${by}\" stroke=\"${s.color}\"/><path class=\"strip-path\" d=\"M${ax} ${ay}L${bx} ${by}\" stroke=\"${s.color}\"/><circle class=\"scene-endpoint\" cx=\"${ax}\" cy=\"${ay}\" r=\"4\"/><circle cx=\"${bx}\" cy=\"${by}\" r=\"2.5\" fill=\"white\"/><text class=\"scene-label\" x=\"${i===0?525:78+Math.min(s.a[0],s.b[0])*480}\" y=\"${i===0?43:62+s.b[1]*240-17}\" text-anchor=\"${i===0?'end':'start'}\">${s.name}<\/text><\/g>`;}).join('')}<\/g><\/svg>`;\n\t\t}\n\t\tfunction updateScene() {const field=document.querySelector('.scene-field');if(!field)return;field.style.opacity=state.on?String(.35+.35*state.bri/100):'.08';field.style.filter=`hue-rotate(${effects.findIndex(e=>e.name===state.effect)*24}deg) saturate(${1-state.white/125})`;const defaults=['#a7c7d5','#ba9cbd','#e3b59d','#dcd4b2'];document.querySelectorAll('#field stop').forEach((s,i)=>s.setAttribute('stop-color',state.effect==='Solid'?state.color:defaults[i]));}\n\t\tfunction render() {\n\t\t\tdocument.getElementById('chevron').innerHTML=icon('chevron');document.querySelector('[data-sheet=\"presets\"]').innerHTML=icon('spark');document.querySelector('[data-sheet=\"settings\"]').innerHTML=icon('gear');document.querySelector('[data-popup=\"menu\"]').innerHTML=icon('more');\n\t\t\tdocument.querySelector('[data-sheet=\"orientation\"]').innerHTML=icon('rotate');const pathsButton=document.querySelector('[data-action=\"paths\"]');pathsButton.innerHTML=icon('layout');pathsButton.setAttribute('aria-pressed',state.showPaths);pathsButton.classList.toggle('blue',state.showPaths);\n\t\t\tconst power=document.querySelector('.power');power.innerHTML=icon('power');power.setAttribute('aria-pressed',state.on);document.getElementById('target-title').textContent=state.strip===-1?'All lights':strips[state.strip].name;document.getElementById('power-label').textContent=state.on?'On in preview':'Off in preview';\n\t\t\tfor(const key of ['bri','speed','intensity','white'])document.getElementById({bri:'brightness',speed:'speed',intensity:'intensity',white:'white'}[key]+'-control').innerHTML=slider({bri:'Brightness',speed:'Speed',intensity:'Intensity',white:'White channel'}[key],key);\n\t\t\tdocument.getElementById('swatches').innerHTML=['#e5ae9c','#ebcf9d','#a6c4b6','#a2b7d9','#c4a8ce'].map(c=>`<button data-color=\"${c}\" style=\"--color:${c}\" aria-label=\"Color ${c}\" aria-pressed=\"${state.color===c}\"><\/button>`).join('')+`<button class=\"custom-color\" data-sheet=\"color\" aria-label=\"Custom color\">${icon('plus')}<\/button>`;\n\t\t\tdocument.getElementById('effect-selector').innerHTML=`<span class=\"effect-thumb\" style=\"--swatch:${effects.find(e=>e.name===state.effect).swatch}\"><\/span><div class=\"grow\"><p class=\"small\">Effect<\/p><strong>${state.effect}<\/strong><\/div>${icon('chevron')}`;\n\t\t\tdocument.getElementById('palette-selector').innerHTML=`<span class=\"effect-thumb\" style=\"--swatch:linear-gradient(135deg,#a7c7d5,#ba9cbd,#e3b59d)\"><\/span><div class=\"grow\"><p class=\"small\">Palette<\/p><strong>${state.palette}<\/strong><\/div>${icon('chevron')}`;\n\t\t\tdocument.getElementById('scene-wrap').innerHTML=scene();document.getElementById('info-icon').innerHTML=icon('info');document.getElementById('scene-caption').textContent=`${state.peek?'Peek preview':'Simulated scene'} · ${state.stage==='scene'?'64 × 40':state.rotation+'° orientation'}`;document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.stage===state.stage));\n\t\t\tdocument.getElementById('dock').innerHTML=strips.map((s,i)=>`<button class=\"strip-card\" data-focus-strip=\"${i}\" aria-pressed=\"${state.strip===i}\"><span class=\"strip-icon\" style=\"--strip-color:${s.color}\">${icon(s.icon)}<\/span><div class=\"grow\"><strong>${s.name}<\/strong><p class=\"small\">${s.leds} LEDs · Canvas Slice<\/p><\/div><\/button>`).join('');document.getElementById('footnote').innerHTML=`${icon('lock')} Local design preview. Changes stay here.${state.timer?' Timer: '+state.timer+' min.':''}`;updateScene();\n\t\t}\n\t\t// All dialogs stay inside the frame; only their content can scroll.\n\t\tfunction openOverlay(kind,type='sheet') {\n\t\t\tif(!activeOverlay)lastFocus=document.activeElement;activeOverlay={kind,type};let body='',title='';\n\t\t\tif(kind==='effect'||kind==='palette') {title=kind==='effect'?'Choose effect':'Choose palette';const items=kind==='effect'?effects:palettes.map(name=>({name,swatch:'linear-gradient(135deg,#a7c7d5,#ba9cbd,#e3b59d)'}));body=`<input class=\"search\" type=\"search\" aria-label=\"Search ${kind}s\" placeholder=\"Search ${kind}s\"><div class=\"scroll\" id=\"option-list\" role=\"listbox\" aria-label=\"${title}\">${items.map(f=>`<button class=\"option\" role=\"option\" aria-selected=\"${state[kind]===f.name}\" data-choose=\"${kind}\" data-name=\"${f.name}\"><span class=\"effect-thumb\" style=\"--swatch:${f.swatch}\"><\/span><span>${f.name}<\/span><span class=\"check\">${state[kind]===f.name?'✓':''}<\/span><\/button>`).join('')}<p class=\"empty\" hidden>No matches<\/p><\/div><p class=\"small\" style=\"padding:8px 9px 3px\">Sample library · local preview<\/p>`;}\n\t\t\tif(kind==='device') {title='Your lights';body=`<button class=\"option\" data-action=\"close\">${icon('wifi')}<div class=\"grow\">Office<p class=\"small\">4 strips · saved layout snapshot<\/p><\/div><span class=\"check\">✓<\/span><\/button><p class=\"small\" style=\"padding:9px\">Device discovery is available in the final UI.<\/p>`;}\n\t\t\tif(kind==='menu') {title='Controls';body=[['timer','timer','Sleep timer'],['sync','sync','Sync lights'],['peek','peek','Peek preview'],['info','info','Device information']].map(([key,ic,label])=>`<button class=\"option\" ${key==='sync'||key==='peek'?`data-toggle=\"${key}\"`:`data-sheet=\"${key}\"`}>${icon(ic)}<span class=\"grow\">${label}<\/span>${key==='sync'||key==='peek'?`<span class=\"switch\" aria-hidden=\"true\" aria-checked=\"${state[key]}\"><\/span>`:icon('chevron')}<\/button>`).join('');}\n\t\t\tif(kind==='presets') {title='Scenes';body=`<p class=\"sheet-note\">A few sample scenes to try in this preview.<\/p><div class=\"preset-list\">${[{name:'Focus',desc:'Warm white. A still, comfortable glow.',bg:'linear-gradient(120deg,#f3eadb,#e8dcc5)'},{name:'After hours',desc:'A softer room, with a little movement.',bg:'linear-gradient(120deg,#e1e7ef,#d8d5e7)'},{name:'Rainbow',desc:'Color across all four strips.',bg:'linear-gradient(120deg,#e8d4e5,#d3e4e4,#f1e1c9)'}].map(p=>`<button class=\"preset\" data-preset=\"${p.name}\" style=\"--swatch:${p.bg}\"><div><strong>${p.name}<\/strong><p class=\"small\">${p.desc}<\/p><\/div>${icon('spark')}<\/button>`).join('')}<\/div>`;}\n\t\t\tif(kind==='orientation') {title='Scene orientation';body=`<p class=\"sheet-note\">Rotate the effect while keeping the strip paths in place.<\/p><div class=\"segmented\" aria-label=\"Scene rotation\">${[0,90,180,270].map(n=>`<button data-rotation=\"${n}\" aria-pressed=\"${state.rotation===n}\">${n}°<\/button>`).join('')}<\/div><p class=\"sheet-note\">Current orientation: <span id=\"rotation-value\">${state.rotation}°<\/span>. Preview only.<\/p>`;}\n\t\t\tif(kind==='timer') {title='Sleep timer';body=`<p class=\"sheet-note\">Choose a preview duration. This does not schedule the controller.<\/p><div class=\"segmented\" aria-label=\"Timer duration\">${[0,15,30,60].map(n=>`<button data-timer=\"${n}\" aria-pressed=\"${state.timer===n}\">${n?n+' min':'Off'}<\/button>`).join('')}<\/div><p class=\"sheet-note\" id=\"timer-note\">${state.timer?'Preview timer: '+state.timer+' minutes':'No preview timer set'}<\/p>`;}\n\t\t\tif(kind==='color') {title='Color';body=`<input class=\"colorwell\" type=\"color\" aria-label=\"Custom scene color\" value=\"${state.color}\" id=\"custom-color\"><p class=\"sheet-note\">Choose a solid color in the local preview.<\/p><button class=\"primary\" data-action=\"apply-color\">Use color<\/button>`;}\n\t\t\tif(kind==='settings') {title='Settings';body=`<p class=\"sheet-note\">Preview the settings flow. No device configuration is changed.<\/p><div>${[['outputs','strip','LED outputs','4 strips'],['network','wifi','Wi-Fi & network','Office'],['streaming','sync','Sync & streaming',''],['schedules','timer','Time & schedules',''],['firmware','gear','Device & firmware','16.0.1']].map(([id,ic,label,value])=>`<button class=\"settings-row\" data-setting=\"${id}\">${icon(ic)}<span>${label}<\/span><span class=\"value\">${value}<\/span>${icon('chevron')}<\/button>`).join('')}<\/div>`;}\n\t\t\tif(kind==='info') {title='Office';body=`<p class=\"sheet-note\">Captured controller information · 10 October 2026<\/p><div>${[['Firmware','WLED 16.0.1'],['Controller','ESP32-C3'],['Physical LEDs','299 RGBW'],['Canvas','64 × 40'],['Light bar','119 LEDs'],['Desk','118 LEDs'],['Left monitor','31 LEDs'],['Right monitor','31 LEDs']].map(([l
