<!doctype html>
<!-- Three throwaway WLED UI variants at one local route, selected by ?variant=A/B/C.
     Layout is based on Office's 2026-10-10 read-only snapshot. All changes are in memory.
     AI: below section was generated by an AI. Geometry follows WLED canvas a/b coordinates. -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>WLED · Local design studio</title>
	<style>
		* { box-sizing:border-box; }
		:root { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme:dark; --bg:#111318; --panel:#191c23; --line:#2b303b; --ink:#f3f4f8; --muted:#a1a7b6; --accent:#b5baff; --soft:#262840; }
		body { margin:0; background:var(--bg); color:var(--ink); font-size:14px; }
		button,input,select { font:inherit; }
		button { cursor:pointer; color:inherit; }
		button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
		button { border:1px solid var(--line); background:transparent; border-radius:10px; padding:10px 14px; min-height:42px; }
		button:hover { background:var(--soft); }
		button[aria-pressed=true],.selected { background:var(--soft); border-color:var(--accent); }
		h1,h2,h3,p { margin:0; } h1 { letter-spacing:-.045em; font-size:34px; font-weight:550; } h2 { font-size:17px; letter-spacing:-.025em; font-weight:550; } h3 { font-size:13px; font-weight:500; }
		.small,.muted { color:var(--muted); } .small { font-size:12px; line-height:1.6; } .mono { font-family:ui-monospace,SFMono-Regular,monospace; font-size:11px; letter-spacing:.04em; }
		.eyebrow { font-size:10px; text-transform:uppercase; letter-spacing:.17em; color:var(--muted); font-weight:650; }
		.row { display:flex; align-items:center; justify-content:space-between; gap:12px; } .stack { display:grid; gap:22px; }
		.brand { display:flex; gap:10px; align-items:center; font-size:19px; font-weight:750; letter-spacing:-.06em; }
		.mark { display:grid; grid-template-columns:repeat(3,4px); gap:3px; transform:rotate(-12deg); } .mark i { background:var(--accent); width:4px; height:16px; border-radius:3px; } .mark i:nth-child(2) { height:23px; margin-top:-3px; }
		.header { padding:22px 32px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:32px; }
		.header .brand { margin-right:24px; } .header .device { margin-left:auto; }
		.tabs { display:flex; gap:4px; } .tabs button { border:0; color:var(--muted); padding:9px 14px; } .tabs .active { color:var(--ink); background:var(--soft); }
		.device { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px; } .dot { height:6px; width:6px; background:#8a93a5; border-radius:50%; }
		.notice { margin:0; padding:10px 32px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
		.shell { max-width:1450px; margin:auto; padding-bottom:100px; }
		.titlebar { padding:28px 32px; } .titlebar h1 { margin-top:7px; } .titlebar p { margin-top:7px; }
		.power { background:var(--ink); color:var(--bg); border:0; border-radius:30px; padding:11px 20px; font-weight:650; } .power:hover { background:var(--accent); } .power[aria-pressed=true] { background:var(--accent); color:var(--bg); }
		.panel { border:1px solid var(--line); border-radius:15px; padding:23px; background:var(--panel); } .panelhead { margin-bottom:22px; }
		.effects { display:grid; gap:7px; } .effect { text-align:left; display:flex; align-items:center; gap:12px; width:100%; padding:11px; border-color:transparent; }
		.effect .thumb { width:37px; height:37px; border-radius:8px; flex-shrink:0; background:var(--swatch); } .effect .effectname { flex:1; } .effect .small { font-size:10px; } .effect .tick { color:var(--accent); }
		.search { display:block; width:100%; padding:11px 13px; border-radius:9px; background:var(--bg); border:1px solid var(--line); color:var(--ink); margin:16px 0 13px; }
		.range { display:grid; gap:8px; } .range .row { font-size:12px; } .range output { color:var(--ink); font-variant-numeric:tabular-nums; } input[type=range] { width:100%; accent-color:var(--accent); height:24px; cursor:pointer; margin:0; }
		.pills { display:flex; flex-wrap:wrap; gap:6px; } .pills button { padding:8px 11px; font-size:12px; }
		.swatches { display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; } .swatches button { height:35px; width:35px; min-height:35px; padding:0; border-radius:50%; background:var(--color); border:3px solid var(--panel); outline:1px solid var(--line); } .swatches button[aria-pressed=true] { outline:2px solid var(--ink); }
		.scene { position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#101219; color:#f4f4f8; }
		.scene-top { position:absolute; top:18px; left:20px; right:20px; z-index:2; } .scene-tag { font-size:10px; color:#b8becd; text-transform:uppercase; letter-spacing:.15em; } .scene svg { display:block; width:100%; height:100%; min-height:270px; }
		.scene .scene-bottom { position:absolute; bottom:18px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
		.scene .scene-bottom button { color:#ddd; background:#171a23; border-color:#393c4c; font-size:11px; min-height:34px; padding:6px 10px; }
		.scene svg .scene-field { opacity:.43; transition:opacity .25s; } .scene svg .path { fill:none; stroke-width:5; stroke-linecap:round; } .scene svg .label { fill:#ececf6; font-size:11px; font-family:inherit; } .scene svg .endpoint { fill:#111318; stroke:#ecedf7; stroke-width:2; }
		.preview-off { opacity:.26!important; } .scene svg .path-dim { opacity:.13; }
		.striplist { display:grid; gap:4px; } .strip { display:grid; grid-template-columns:9px 1fr auto; width:100%; text-align:left; align-items:center; gap:10px; padding:12px 10px; border-color:transparent; }
		.strip .stripdot { width:7px; height:7px; border-radius:50%; background:var(--strip); } .strip .small { font-size:11px; } .strip span:nth-child(2) { display:grid; gap:4px; }
		.presets { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .preset { text-align:left; padding:15px; } .preset .presetbar { height:4px; border-radius:5px; margin-bottom:14px; background:var(--swatch); } .preset .small { display:block; margin-top:5px; }
		.studio { display:grid; grid-template-columns:242px minmax(0,1fr) 265px; gap:22px; padding:0 32px; }
		.studio .library { border-right:1px solid var(--line); padding-right:22px; } .studio .center { display:grid; align-content:start; gap:22px; } .studio .scene { height:365px; } .studio .inspector { display:grid; gap:22px; align-content:start; }
		.studio .library .eyebrow { margin-bottom:8px; } .library-footer { margin-top:25px; padding-top:20px; border-top:1px solid var(--line); }
		.canvas-layout { display:grid; grid-template-columns:minmax(0,1fr) 278px; gap:22px; padding:0 32px; }
		.canvas-layout .stage { display:grid; gap:18px; align-content:start; } .canvas-layout .scene { height:455px; } .canvas-layout .rail { display:grid; gap:20px; align-content:start; } .canvas-layout .effects { grid-template-columns:repeat(4,1fr); } .canvas-layout .effect { display:grid; gap:9px; padding:13px; border-color:var(--line); } .canvas-layout .effect .thumb { width:100%; height:50px; } .canvas-layout .effect .tick,.canvas-layout .effect .small { display:none; } .canvas-layout .presets { grid-template-columns:1fr; } .canvas-layout .preset { min-height:55px; }
		body[data-variant=B] { --bg:#0c1013; --panel:#131a1e; --line:#29373d; --accent:#9dd5bd; --soft:#223a32; } body[data-variant=B] h1 { font-size:40px; } body[data-variant=B] .header .tabs button.active { color:var(--accent); background:transparent; border-radius:0; border-bottom:1px solid var(--accent); }
		body[data-variant=C] { color-scheme:light; --bg:#eeece7; --panel:#f8f6f1; --line:#d7d4cc; --ink:#242820; --muted:#687063; --accent:#496342; --soft:#e0e7db; }
		body[data-variant=C] .header { border-bottom:0; } body[data-variant=C] .notice { background:#e5e3dc; } body[data-variant=C] button { border-radius:4px; } body[data-variant=C] .power { border-radius:30px; } body[data-variant=C] .panel { border-radius:5px; } body[data-variant=C] .mark i { background:#496342; } body[data-variant=C] .tabs .active { background:transparent; text-decoration:underline; text-underline-offset:8px; }
		.quiet-layout { padding:38px 50px 10px; display:grid; grid-template-columns:1fr 1.2fr; gap:48px; } .quiet-intro .roomtitle { font-size:70px; font-weight:450; margin:12px 0 20px; line-height:1; } .quiet-intro .power { margin-top:25px; } .quiet-intro .range { margin-top:35px; } .quiet-layout .scene { height:320px; border-radius:5px; } .quiet-layout .quiet-intro .small { max-width:300px; } .quiet-layout .controls { display:grid; gap:24px; margin-top:28px; } .quiet-layout .presets { margin-top:16px; } .quiet-layout .striplist { margin-top:15px; } .quiet-layout .strip { border-bottom:1px solid var(--line); border-radius:0; padding:15px 0; } .quiet-layout .effect { padding:10px; border:1px solid var(--line); } .quiet-layout .effects { grid-template-columns:repeat(2,1fr); } .quiet-layout .effect .thumb { width:26px; height:26px; } .quiet-layout .effect .small { display:none; }
		.detail { padding:0 32px; } .detail .effects { display:grid; grid-template-columns:repeat(3,1fr); } .detail .effect { border-color:var(--line); } .detail .panel { max-width:1050px; margin:auto; } .detail .striplist { max-width:550px; } .detail .presets { margin-top:22px; }
		.switcher { position:fixed; z-index:20; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; background:#f7f8fc; color:#252633; border:1px solid #cdd0da; padding:6px; border-radius:40px; box-shadow:0 12px 40px #0004; max-width:calc(100% - 24px); }
		.switcher button { color:#252633; border:0; border-radius:25px; white-space:nowrap; font-size:12px; padding:8px 14px; min-height:35px; } .switcher button:hover { background:#e0e2ec; } .switcher button[aria-pressed=true] { background:#252633; color:#fff; } .switcher .arrow { padding:8px 12px; }
		.toast { position:fixed; bottom:83px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:12px; padding:9px 17px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s; }
		.empty { padding:18px; color:var(--muted); } .context { padding:10px 32px 16px; font-size:11px; color:var(--muted); }
		@media(max-width:1100px) { .studio { grid-template-columns:205px minmax(0,1fr); } .studio .inspector { grid-column:1/-1; grid-template-columns:1fr 1fr; } .studio .scene { height:330px; } .canvas-layout .effects { grid-template-columns:repeat(2,1fr); } .header { gap:12px; } .header .brand { margin-right:5px; } .tabs button { padding:9px 10px; } }
		@media(max-width:700px) { .header { padding:18px 18px 12px; flex-wrap:wrap; gap:17px; } .header .tabs { order:3; width:100%; justify-content:space-between; } .header .device { margin-left:auto; font-size:11px; } .notice { padding:10px 18px; display:block; line-height:1.5; } .notice span:last-child { display:none; } .titlebar { padding:23px 18px; align-items:flex-start; } h1 { font-size:28px; } .titlebar p { max-width:210px; } .titlebar .power { padding:10px 15px; } .studio { padding:0 18px; grid-template-columns:1fr; gap:24px; } .studio .center { grid-row:1; } .studio .library { border-right:0; padding:0; } .studio .library .effects { grid-template-columns:1fr 1fr; } .studio .effect .small { display:none; } .studio .inspector { grid-template-columns:1fr; } .studio .scene { height:300px; } .presets { gap:6px; } .preset { padding:12px 10px; font-size:12px; } .canvas-layout { padding:0 18px; grid-template-columns:1fr; } .canvas-layout .scene { height:345px; } .canvas-layout .rail { grid-template-columns:1fr; } .canvas-layout .presets { grid-template-columns:repeat(3,1fr); } .panel { padding:19px; } .quiet-layout { padding:28px 20px; gap:28px; grid-template-columns:1fr; } .quiet-intro .roomtitle { font-size:58px; } .quiet-layout .scene { height:290px; } .quiet-layout .controls { margin-top:0; } .quiet-layout .range { margin-top:24px; } .detail { padding:0 18px; } .detail .effects { grid-template-columns:1fr; } .switcher button { padding:8px 11px; font-size:11px; } .switcher .arrow { padding:8px; } .context { padding:10px 18px; } .scene-bottom .mono { font-size:9px; } }
		@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
	</style>
</head>
<body data-variant="A">
	<div id="app"></div>
	<nav class="switcher" aria-label="Design directions">
		<button class="arrow" data-cycle="-1" aria-label="Previous design">←</button>
		<button data-variant="A">1 · Studio</button><button data-variant="B">2 · Canvas</button><button data-variant="C">3 · Quiet</button>
		<button class="arrow" data-cycle="1" aria-label="Next design">→</button>
	</nav>
	<div id="toast" class="toast" role="status"></div>
	<script>
		const variants = ['A','B','C'];
		const effects = [
			{name:'Blends',type:'2D · Color',swatch:'linear-gradient(135deg,#702b82,#d57179,#48878c)'},
			{name:'Ripple Rainbow',type:'2D · Motion',swatch:'radial-gradient(circle at 20% 80%,#70cfa4,#3b738e 40%,#cf6f97 70%,#ce9c59)'},
			{name:'Aurora',type:'2D · Ambient',swatch:'linear-gradient(130deg,#182837,#63ac98,#57558c)'},
			{name:'Solid',type:'Color',swatch:'linear-gradient(130deg,#cb785c,#edbe81)'},
			{name:'Fire 2012',type:'Motion',swatch:'linear-gradient(0deg,#d9462b,#c39a3c,#37221b)'},
			{name:'Noise',type:'2D · Texture',swatch:'conic-gradient(#577887,#b87d8f,#6b7a4f,#577887)'},
			{name:'Pacifica',type:'Ambient',swatch:'linear-gradient(130deg,#235273,#67abac,#163746)'},
			{name:'Rainbow',type:'Color · Motion',swatch:'linear-gradient(110deg,#bd5960,#c6b568,#60a794,#6984bc,#a46ab0)'}
		];
		const strips = [
			{name:'Light bar',leds:119,color:'#dcae74',a:[1,1],b:[1,0]},
			{name:'Desk',leds:118,color:'#9eafff',a:[0,.583],b:[1,.583]},
			{name:'Left monitor',leds:31,color:'#b891d4',a:[.4983,.3007],b:[.2227,.2992]},
			{name:'Right monitor',leds:31,color:'#83cabb',a:[.5252,.3],b:[.7993,.3]}
		];
		const requested = new URLSearchParams(location.search).get('variant');
		const state = {variant:variants.includes(requested)?requested:'A',view:'Controls',on:true,bri:80,speed:73,intensity:10,white:0,effect:'Blends',color:'#d57179',strip:-1,rotation:90,showPaths:true};
		const mark = '<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>';
		// Return the local power button; this never calls the device API.
		function power() { return `<button class="power" data-action="power" aria-pressed="${state.on}">⏻ &nbsp; ${state.on?'Preview on':'Preview off'}</button>`; }
		function range(label,key) { return `<label class="range"><span class="row"><span>${label}</span><output data-value="${key}">${state[key]}%</output></span><input type="range" aria-label="${label}" min="0" max="100" value="${state[key]}" data-range="${key}"></label>`; }
		function effectList(limit=8) { return `<div class="effects">${effects.slice(0,limit).map(f=>`<button class="effect" data-effect="${f.name}" aria-pressed="${state.effect===f.name}"><span class="thumb" style="--swatch:${f.swatch}"></span><span class="effectname"><span>${f.name}</span><br><span class="small">${f.type}</span></span><span class="tick">${state.effect===f.name?'●':''}</span></button>`).join('')}</div><p class="empty" hidden>No matching effects.</p>`; }
		function stripList() { return `<div class="striplist">${strips.map((s,i)=>`<button class="strip" data-strip="${i}" aria-pressed="${state.strip===i}"><span class="stripdot" style="--strip:${s.color}"></span><span>${s.name}<span class="small">Canvas Slice</span></span><span class="mono">${s.leds} LEDs</span></button>`).join('')}</div>`; }
		function presets() { return `<div class="presets">${[{name:'Focus',hint:'Warm · Still',bg:'linear-gradient(90deg,#dab47e,#daccb0)'},{name:'After hours',hint:'Dim · Aurora',bg:'linear-gradient(90deg,#547c78,#837198)'},{name:'Rainbow',hint:'Color · Motion',bg:effects[7].swatch}].map(p=>`<button class="preset" data-preset="${p.name}"><div class="presetbar" style="--swatch:${p.bg}"></div>${p.name}<span class="small">${p.hint}</span></button>`).join('')}</div>`; }
		function colors() { return `<div><div class="row"><h3>Color</h3><span class="small">RGB + white</span></div><div class="swatches">${['#d57179','#e0b781','#89bfb0','#8b9dde','#bc90d0','#eeeeea'].map(c=>`<button aria-label="Color ${c}" style="--color:${c}" data-color="${c}" aria-pressed="${state.color===c}"></button>`).join('')}</div></div>`; }
		// Draw normalized physical strip endpoints over a synthetic scene, not WLED pixels.
		function scene() { return `<div class="scene"><div class="row scene-top"><span class="scene-tag">Spatial preview</span><span class="mono" style="color:#aeb4c2">64 × 40</span></div><svg viewBox="0 0 620 390" aria-label="Simulated effect with saved Office strip geometry" role="img"><defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#e3e6f1" opacity=".18"/></pattern><linearGradient id="field" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#83baa4"/><stop offset=".28" stop-color="#556d9d"/><stop offset=".57" stop-color="#b968a1"/><stop offset=".8" stop-color="#d7a473"/><stop offset="1" stop-color="#acb77b"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="30"/></filter></defs><rect width="620" height="390" fill="url(#grid)"/><g class="scene-field" transform="rotate(${state.rotation-90} 310 195)"><path fill="url(#field)" filter="url(#blur)" d="M40 330C60 70 215 40 303 82S350 284 555 42L585 340Z"/><path d="M0 360C105 290 35 100 173 90S323 363 436 295S520 109 620 58" stroke="url(#field)" stroke-width="65" fill="none" opacity=".6"/></g><g id="paths" ${state.showPaths?'':'visibility="hidden"'}>${strips.map((s,i)=>{const ax=70+s.a[0]*480,ay=73+s.a[1]*240,bx=70+s.b[0]*480,by=73+s.b[1]*240;return `<g data-path="${i}" ${state.strip!==-1&&state.strip!==i?'class="path-dim"':''}><path class="path" d="M${ax} ${ay}L${bx} ${by}" stroke="${s.color}"/><circle class="endpoint" cx="${ax}" cy="${ay}" r="5"/><circle cx="${bx}" cy="${by}" r="3" fill="${s.color}"/><text class="label" x="${i===0?bx-68:Math.min(ax,bx)}" y="${i===0?by-12:by-14}">${s.name}</text></g>`;}).join('')}</g></svg><div class="scene-bottom"><span class="mono">SIMULATED · <span data-scene-effect>${state.effect}</span></span><div class="pills"><button data-action="rotate" aria-label="Rotate simulated scene 90 degrees">↻ 90°</button><button data-action="paths" aria-pressed="${state.showPaths}">Strips</button></div></div></div>`; }
		function header() { return `<header class="header"><div class="brand">${mark} WLED</div><nav class="tabs" aria-label="Workspace">${['Controls','Effects','Presets','Settings'].map(t=>`<button data-view="${t}" class="${state.view===t?'active':''}">${t}</button>`).join('')}</nav><div class="device"><span class="dot"></span>Office <span class="mono">/ LOCAL</span></div></header><div class="notice"><span>DESIGN PROTOTYPE · Controls affect this preview only</span><span>Office geometry · snapshot 10 Oct 2026 · controller was off</span></div>`; }
		function title(subtitle) { return `<div class="row titlebar"><div><span class="eyebrow">4 strips / 299 LEDs</span><h1>Office</h1><p class="small">${subtitle}</p></div>${power()}</div>`; }
		function studio() { return `${title('Effects, color, and space. In one workspace.')}<div class="studio"><aside class="library"><span class="eyebrow">Effect library</span><h2>Find a feeling</h2><input class="search" aria-label="Search effects" placeholder="Search effects…" type="search">${effectList()}<div class="library-footer small">8 sample effects shown.<br>The full WLED library stays available in the final UI.</div></aside><main class="center">${scene()}<section><div class="row"><h2>Preview presets</h2><span class="small">One tap, a different mood</span></div><div style="margin-top:15px">${presets()}</div></section></main><aside class="inspector"><section class="panel stack"><div class="row"><h2>Scene controls</h2><span class="small" data-effect-title>${state.effect}</span></div>${range('Brightness','bri')}${range('Speed','speed')}${range('Intensity','intensity')}${colors()}${range('White channel','white')}</section><section><div class="row"><h2>Outputs</h2><button data-action="all" class="small">All strips</button></div>${stripList()}</section></aside></div>`; }
		function canvasView() { return `${title('Compose the scene. Let your room follow.')}<div class="canvas-layout"><main class="stage">${scene()}<section><div class="row" style="margin-bottom:15px"><h2>Scene effect</h2><button data-view="Effects" class="small">Browse library ↗</button></div>${effectList(4)}</section></main><aside class="rail"><section class="panel stack"><h2>Light & motion</h2>${range('Brightness','bri')}${range('Speed','speed')}${range('Intensity','intensity')}${colors()}</section><section><div class="row"><h2>Strip paths</h2><button data-action="all" class="small">Show all</button></div>${stripList()}</section><section><h2>Preview presets</h2><div style="margin-top:15px">${presets()}</div></section></aside></div>`; }
		function quiet() { return `<main class="quiet-layout"><section class="quiet-intro"><span class="eyebrow">A little atmosphere</span><h1 class="roomtitle">Office.</h1><p class="small">Four strips. One shared scene.<br>A quieter place to shape your light.</p>${power()}${range('Brightness','bri')}<section style="margin-top:36px"><h2>Preview presets</h2>${presets()}</section><section style="margin-top:34px"><div class="row"><h2>In your room</h2><button data-action="all" class="small">All strips</button></div>${stripList()}</section></section><section>${scene()}<div class="controls"><div><div class="row" style="margin-bottom:15px"><h2>Effect</h2><button data-view="Effects" class="small">Explore all ↗</button></div>${effectList(4)}</div><div class="stack">${range('Speed','speed')}${range('Intensity','intensity')}${colors()}${range('White channel','white')}</div></div></section></main>`; }
		function detail() {
			let content='';
			if(state.view==='Effects') content=`<h2>Effect library</h2><p class="small" style="margin-top:8px">Sample library for exploring the design.</p><input class="search" aria-label="Search effects" placeholder="Search effects…" type="search">${effectList()}`;
			if(state.view==='Presets') content=`<h2>A room in one tap</h2><p class="small" style="margin-top:8px">Sample presets · changes remain in this preview.</p>${presets()}`;
			if(state.view==='Settings') content=`<h2>Settings, with room to breathe</h2><p class="small" style="margin-top:10px">First-round scope is the everyday control interface. These entries preview the settings navigation.</p><div class="stack" style="margin-top:25px">${['LED outputs','Wi-Fi & network','Sync & streaming','Time & schedules','Device & firmware'].map(s=>`<button data-settings="${s}" class="row">${s}<span class="muted">↗</span></button>`).join('')}</div><p class="small" id="settings-note" style="margin-top:20px">No device configuration is loaded or changed here.</p>`;
			return `${title('A local preview of the WLED workspace.')}<main class="detail"><section class="panel">${content}</section></main>`;
		}
		// Render only local state and keep variant selection shareable in the URL.
		function render() {
			document.body.dataset.variant=state.variant;
			document.getElementById('app').innerHTML=`<div class="shell">${header()}${state.view==='Controls'?(state.variant==='A'?studio():state.variant==='B'?canvasView():quiet()):detail()}<p class="context">Preview: power ${state.on?'on':'off'} · brightness <span data-value="bri">${state.bri}%</span> · <span data-effect-title>${state.effect}</span> · <span data-target>${state.strip===-1?'all strips':strips[state.strip].name}</span> · <span data-rotation>${state.rotation}°</span> orientation</p></div>`;
			document.querySelectorAll('.switcher [data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===state.variant)));
			updateScene();
		}
		function updateScene() {
			const f=document.querySelector('.scene-field');
			if(!f)return;
			f.style.opacity=state.on?String((.35+.4*state.bri/100)*(.7+.3*state.intensity/100)):'.13';
			const hue={Blends:0,'Ripple Rainbow':35,Aurora:65,Solid:0,'Fire 2012':220,Noise:90,Pacifica:130,Rainbow:15};
			f.style.filter=`hue-rotate(${hue[state.effect]}deg) saturate(${1-state.white/130})`;
			const defaults=['#83baa4','#556d9d','#b968a1','#d7a473','#acb77b'];
			document.querySelectorAll('#field stop').forEach((stop,i)=>stop.setAttribute('stop-color',state.effect==='Solid'?state.color:defaults[i]));
		}
		function switchVariant(v) { state.variant=v;if(/^https?:$/.test(location.protocol)){const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);}render(); }
		let toastTimer;
		function notify(text) { const el=document.getElementById('toast');el.textContent=text;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1800); }
		document.addEventListener('click',e=>{
			const b=e.target.closest('button');if(!b)return;
			if(b.dataset.variant) { switchVariant(b.dataset.variant);return; }
			if(b.dataset.cycle) { switchVariant(variants[(variants.indexOf(state.variant)+Number(b.dataset.cycle)+3)%3]);return; }
			if(b.dataset.view) {state.view=b.dataset.view;render();return;}
			if(b.dataset.effect) {state.effect=b.dataset.effect;render();notify('Effect changed in preview');return;}
			if(b.dataset.strip!==undefined) {state.strip=state.strip===Number(b.dataset.strip)?-1:Number(b.dataset.strip);render();return;}
			if(b.dataset.color) {state.color=b.dataset.color;state.effect='Solid';render();notify('Color selected in preview');return;}
			if(b.dataset.preset) { const p=b.dataset.preset;state.on=true;state.bri=p==='Focus'?65:p==='After hours'?25:80;state.effect=p==='Focus'?'Solid':p==='After hours'?'Aurora':'Ripple Rainbow';render();notify(`${p} applied to preview`);return; }
			if(b.dataset.settings) {document.getElementById('settings-note').textContent=`${b.dataset.settings}: visual navigation only in this round.`;return;}
			if(b.dataset.action==='power')state.on=!state.on;
			if(b.dataset.action==='rotate')state.rotation=(state.rotation+90)%360;
			if(b.dataset.action==='paths')state.showPaths=!state.showPaths;
			if(b.dataset.action==='all')state.strip=-1;
			render();
		});
		document.addEventListener('input',e=>{
			if(e.target.dataset.range) {const key=e.target.dataset.range;state[key]=Number(e.target.value);document.querySelectorAll(`[data-value="${key}"]`).forEach(n=>n.textContent=`${state[key]}%`);updateScene();}
			if(e.target.matches('.search')) {const q=e.target.value.toLowerCase();let count=0;document.querySelectorAll('.effect').forEach(n=>{n.hidden=!n.dataset.effect.toLowerCase().includes(q);n.style.display=n.hidden?'none':'';if(!n.hidden)count++;});document.querySelector('.empty').hidden=count!==0;}
		});
		document.addEventListener('keydown',e=>{if(e.target instanceof Element && e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();switchVariant(variants[(variants.indexOf(state.variant)+(e.key==='ArrowRight'?1:-1)+3)%3]);}});
		render();
		console.info('Local WLED design prototype ready: no device API calls; state is in memory.');
	</script>
</body>
