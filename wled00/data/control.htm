	<script src="common.js"></script>

	<main class="window" aria-label="WLED controller">
		<header class="topbar">
			<div class="identity"><span class="device-mark"><svg aria-hidden="true" class="icon"><use href="#icon-light"/></svg></span><div><h1 id="device-name">WLED</h1><span id="connection">Connecting…</span></div></div>
			<div class="global-controls" aria-label="All lights">
				<label class="range-label global-brightness">All lights <output id="brightness-value">—</output><input id="brightness" aria-label="Brightness of all lights" type="range" min="1" max="255" value="128" disabled></label>
				<button id="power" class="power" aria-label="Power of all lights" aria-pressed="false" disabled><svg aria-hidden="true" class="icon"><use href="#icon-power"/></svg><span id="power-label">Off</span></button>
			</div>
			<div class="top-actions">
				<button id="presets-button" class="presets-button" aria-label="Presets" title="Saved looks and playlists"><svg aria-hidden="true" class="icon"><use href="#icon-presets"/></svg><span>Presets</span></button>
				<button id="settings-button" class="icon-button" aria-label="Settings" title="Settings"><svg aria-hidden="true" class="icon"><use href="#icon-settings"/></svg></button>
				<button id="info-button" class="icon-button" aria-label="Device information" title="Device information"><svg aria-hidden="true" class="icon"><use href="#icon-info"/></svg></button>
			</div>
		</header>
		<div class="workspace">
			<section class="stage" aria-label="Live lighting preview">
				<div class="stage-toolbar">
					<div class="segmented" aria-label="Preview mode"><button id="scene-tab" aria-pressed="true">Scene</button><button id="strips-tab" aria-pressed="false">Strips</button></div>
					<div class="stage-actions"><button id="paths-button" aria-label="Show strip paths" aria-pressed="true" title="Show strip paths"><svg aria-hidden="true" class="icon"><use href="#icon-path"/></svg><span>Paths</span></button><button id="layout-button" aria-label="Edit strip layout" title="Edit strip layout"><svg aria-hidden="true" class="icon"><use href="#icon-layout"/></svg><span>Layout</span></button></div>
				</div>
				<div class="artboard"><canvas id="scene" width="960" height="600" aria-label="Live controller scene and strip paths"></canvas></div>
				<div id="strip-dock" class="strip-dock" aria-label="Select a strip"></div>
				<div class="stage-caption"><div class="preview-caption"><span id="frame-status">Waiting for controller</span><span id="scene-caption">Pixels come from the controller</span></div><label class="inline"><input type="checkbox" id="boost" checked> Preview boost</label></div>
			</section>
			<section class="inspector" aria-label="Lighting controls">
				<div class="inspector-heading"><span class="eyebrow">Adjust</span><button id="target-button" class="target" aria-haspopup="dialog" aria-expanded="false" title="Choose scene or strip">Scene</button></div>
				<div class="controls-scroll" id="controls-scroll"><fieldset id="lighting" disabled>
					<div class="color-controls">
						<div class="label-row"><span>Color</span><div class="color-slots" id="color-slots"><button data-color="0" aria-label="Primary color" aria-pressed="true"></button><button data-color="1" aria-label="Secondary color" aria-pressed="false"></button><button data-color="2" aria-label="Third color" aria-pressed="false"></button></div></div>
						<div class="color-row"><input id="color" type="color" value="#e5ae9c" aria-label="Selected color"><input id="hex" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Hex color" value="#e5ae9c"><button id="swap" class="icon-button" aria-label="Swap primary and secondary colors" title="Swap colors"><svg aria-hidden="true" class="icon"><use href="#icon-swap"/></svg></button></div>
						<label id="white-label" class="range-label">White <output id="white-value">—</output><input id="white" type="range" min="0" max="255"></label>
						<label id="cct-label" class="range-label">Temperature <output id="cct-value">—</output><input id="cct" type="range" min="0" max="255"></label>
					</div>
					<div class="effect-controls">
						<button id="effect-button" class="selector"><span class="selector-copy"><span class="selector-label">Effect</span><span id="effect-name">—</span></span><span id="effect-preview" class="thumbnail"></span><svg class="icon chevron"><use href="#icon-chevron"/></svg></button>
						<button id="palette-button" class="selector"><span class="selector-copy"><span class="selector-label">Palette</span><span id="palette-name">—</span></span><span id="palette-preview" class="thumbnail"></span><svg class="icon chevron"><use href="#icon-chevron"/></svg></button>
					</div>
					<div id="parameters"></div>
					<button id="follow-scene-button" class="follow-button" hidden>Follow scene <svg aria-hidden="true" class="icon"><use href="#icon-chevron"/></svg></button>
					<button id="advanced-button" class="advanced-button"><svg aria-hidden="true" class="icon"><use href="#icon-adjust"/></svg><span>More controls</span><svg class="icon chevron"><use href="#icon-chevron"/></svg></button>
					<div id="advanced-controls" hidden>
						<button id="orientation-button" class="full-row">Scene orientation <span id="orientation-name">0°</span></button><button id="segment-button" class="full-row">Segment controls <span>›</span></button><button id="timer-button" class="full-row">Sleep timer <span id="timer-name">Off</span></button><button id="sync-button" class="full-row" aria-pressed="false">Sync send <span id="sync-name">Off</span></button><button id="transition-button" class="full-row">Transition <span id="transition-name">—</span></button><button id="realtime-button" class="full-row">Realtime override <span id="realtime-name">—</span></button>
					</div>
				</fieldset></div>
				<footer class="inspector-footer"><span class="status-dot" aria-hidden="true"></span><span id="command-status" role="status" aria-live="polite">Connecting…</span><button id="retry" hidden>Reconnect</button></footer>
			</section>
		</div>
	</main>
	<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><button id="sheet-back" class="icon-button" aria-label="Back" hidden><svg aria-hidden="true" class="icon"><use href="#icon-back"/></svg></button><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-button" aria-label="Close" title="Close"><svg aria-hidden="true" class="icon"><use href="#icon-close"/></svg></button></div><div id="sheet-body" class="sheet-body"></div></dialog>

	<script src="control-previews.js"></script>
	<script src="control.js"></script>
</body>
</html>
