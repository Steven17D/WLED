<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
	<meta charset="utf-8">
	<meta name="theme-color" content="#222222">
	<title>WLED Live Preview</title>
	<style>
	body {
		margin: 0;
		background: #000;
	}
	#stripControl, #streamStatus {
		position: fixed;
		z-index: 1;
		padding: 5px 8px;
		border-radius: 6px;
		background: rgba(0,0,0,.75);
		color: #eee;
		font: 12px system-ui, sans-serif;
	}
	#stripControl {top: 6px; right: 6px;}
	#stripControl input {vertical-align: middle;}
	#streamStatus {bottom: 6px; left: 6px;}
	[hidden] {display: none !important;}
	</style>
</head>
<body>
	<canvas id="canv" aria-label="Live 2D scene and strip positions"></canvas>
	<label id="stripControl" hidden><input id="showStrips" type="checkbox" checked> Strips</label>
	<span id="streamStatus" role="status" hidden>Realtime stream · scene preview paused</span>
	<script>
		// load common.js with retry on error
		(function common() {
			const l = document.createElement('script');
			l.src = 'common.js';
			l.onload = () => S();
			l.onerror = () => setTimeout(common, 100);
			document.head.appendChild(l);
		})();
		// AI: below section was generated by an AI
		// Overlay saved paths from spatial_canvas.cpp on WLED's native L2 preview.
		var c = document.getElementById('canv');
		var ctx = c.getContext('2d'), frame, canvasState, stripPaths = [];
		var throttled = false, layoutRetry;
		const stripColors = ['#ffb446','#82e3a5','#77bfff','#dc9aff'];
		const stripControl = document.getElementById('stripControl');
		const showStrips = document.getElementById('showStrips');
		const streamStatus = document.getElementById('streamStatus');
		function setCanvas() {
			c.width  = window.innerWidth * 0.98; //remove scroll bars
			c.height = window.innerHeight * 0.98; //remove scroll bars
			draw();
		}
		// Only accept bounded normalized paths. Names are drawn as text, never HTML.
		function receiveState(next) {
			if (!next || typeof next !== 'object') return;
			const state = next.state || next;
			if (!state || typeof state !== 'object' || !('canvas' in state || 'seg' in state)) return;
			const layout = state.canvas;
			const validPoint = point => Array.isArray(point) && point.length === 2 && point.every(value => Number.isFinite(value) && value >= 0 && value <= 1);
			canvasState = undefined; stripPaths = [];
			if (layout && layout.enabled === true && Array.isArray(layout.strips) && layout.strips.length === 4 && layout.strips.every(path => path && validPoint(path.a) && validPoint(path.b) && typeof path.reverse === 'boolean')) {
				canvasState = layout;
				stripPaths = layout.strips.map((path, index) => {
					const segment = Array.isArray(state.seg) ? state.seg.find(seg => seg && seg.id === path.segment) : undefined;
					return {...path, name: typeof path.name === 'string' ? path.name.slice(0,32) : `Strip ${index+1}`, ownEffect: segment && segment.fx !== layout.sliceFx};
				});
			}
			stripControl.hidden = !canvasState;
			streamStatus.hidden = !canvasState || !canvasState.realtime;
			draw();
		}
		// Startup metadata uses a read-only request; the shared parent WS supplies edits.
		async function loadLayout() {
			try {
				const response = await fetch(getURL('/json/state'));
				if (!response.ok) throw new Error('State unavailable');
				receiveState(await response.json());
			} catch (error) {layoutRetry = setTimeout(loadLayout, 3000);}
		}
		// Positions span the centers of the displayed grid, including downsampled L2 frames.
		function drawStrips(pPL, lOf, mW, mH) {
			ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
			ctx.font = `${Math.max(10,Math.min(13,c.width/55))}px system-ui, sans-serif`;
			stripPaths.forEach((path,index) => {
				const point = value => [lOf + (.5+value[0]*(mW-1))*pPL, (.5+value[1]*(mH-1))*pPL];
				const a = point(path.a), b = point(path.b), start = path.reverse ? b : a, end = path.reverse ? a : b;
				ctx.setLineDash(path.ownEffect ? [6,4] : []);
				ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b);
				ctx.strokeStyle = '#000'; ctx.lineWidth = 7; ctx.stroke();
				ctx.strokeStyle = stripColors[index]; ctx.lineWidth = 3; ctx.stroke();
				ctx.setLineDash([]); ctx.fillStyle = stripColors[index];
				ctx.beginPath(); ctx.arc(...start,4,0,2*Math.PI); ctx.fill();
				if (Math.hypot(end[0]-start[0],end[1]-start[1]) > 1) {
					const angle = Math.atan2(end[1]-start[1],end[0]-start[0]);
					ctx.beginPath(); ctx.moveTo(...end);
					ctx.lineTo(end[0]-9*Math.cos(angle-.5),end[1]-9*Math.sin(angle-.5));
					ctx.lineTo(end[0]-9*Math.cos(angle+.5),end[1]-9*Math.sin(angle+.5)); ctx.closePath(); ctx.fill();
				}
				const text = path.name + (path.ownEffect ? ' (own effect)' : '');
				const width = Math.min(ctx.measureText(text).width,c.width-12);
				const x = Math.max(6,Math.min(c.width-width-6,(a[0]+b[0]-width)/2));
				const y = Math.max(16,Math.min(c.height-5,(a[1]+b[1])/2-9));
				ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(x-4,y-13,width+8,17);
				ctx.fillStyle = stripColors[index]; ctx.fillText(text,x,y,width);
			});
			ctx.restore();
		}
		// Clear the previous overlay before each frame or metadata/size change.
		function draw() {
			if (!ctx) return;
			ctx.clearRect(0,0,c.width,c.height);
			if (!frame) return;
			const mW = frame[2], mH = frame[3];
			const pPL = Math.min(c.width/mW,c.height/mH), lOf = Math.floor((c.width-pPL*mW)/2);
			if (!canvasState || !canvasState.realtime) {
				let i = 4;
				for (let y=.5; y<mH; y++) for (let x=.5; x<mW; x++) {
					ctx.fillStyle = `rgb(${frame[i]},${frame[i+1]},${frame[i+2]})`;
					ctx.beginPath(); ctx.arc(x*pPL+lOf,y*pPL,pPL*.4,0,2*Math.PI); ctx.fill(); i+=3;
				}
			}
			if (canvasState && showStrips.checked) drawStrips(pPL,lOf,mW,mH);
		}
		function S() { // Startup function (onload)
			setCanvas();
			if (!ctx) return;
			loadLayout();
			ws = connectWs(ws => ws.send('{"lv":true}')); // use parent WS or open new
			ws.addEventListener('message',receivePreview);
		}
		// The Peek iframe may reuse the parent's socket; release its listener on close.
		function receivePreview(event) {
			try {
				if (typeof event.data === 'string') {receiveState(JSON.parse(event.data)); return;}
				if (toString.call(event.data) !== '[object ArrayBuffer]') return;
				const data = new Uint8Array(event.data);
				if (data[0] !== 76 || data[1] !== 2 || !data[2] || !data[3] || data.length < 4+data[2]*data[3]*3) return;
				frame = data; draw();
			} catch (error) {console.error('Peek WS error:',error);}
		}
		window.addEventListener('pagehide',() => {
			if (typeof ws !== 'undefined') ws.removeEventListener('message',receivePreview);
			clearTimeout(layoutRetry);
		});
		showStrips.onchange = draw;
		// AI: end
		// window.resize event listener
		window.addEventListener('resize', (e)=>{
			if (!throttled) {     // only run if we're not throttled
				setCanvas();      // actual callback action
				throttled = true; // we're throttled!
				setTimeout(()=>{  // set a timeout to un-throttle
					throttled = false;
				}, 250);
			}
		});
	</script>
</body>
</html>
